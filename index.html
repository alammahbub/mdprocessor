<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SuperMD — A high-fidelity hybrid markdown word processor. Edit markdown with a premium WYSIWYG canvas and synchronized code editor." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>SuperMD</title>
    <script>
      window.addEventListener('error', function(event) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 20px; background: #fff5f5; color: #cc0000; border: 2px solid #cc0000; font-family: monospace; border-radius: 8px; margin: 20px; text-align: left;">
              <h2 style="margin-top: 0; color: #a80000;">🚨 Unhandled Runtime Error Caught:</h2>
              <p style="font-weight: bold; font-size: 16px;">${event.message}</p>
              <pre style="background: #1e1e1e; color: #fff; padding: 12px; border-radius: 4px; overflow: auto; max-height: 400px;">${event.error ? event.error.stack : 'No stack trace available'}</pre>
              <p style="color: #666; font-size: 12px;">Please reload the page after resolving the issue.</p>
            </div>
          `;
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 20px; background: #fff5f5; color: #cc0000; border: 2px solid #cc0000; font-family: monospace; border-radius: 8px; margin: 20px; text-align: left;">
              <h2 style="margin-top: 0; color: #a80000;">🚨 Unhandled Promise Rejection:</h2>
              <p style="font-weight: bold; font-size: 16px;">${event.reason}</p>
              <p style="color: #666; font-size: 12px;">Please reload the page after resolving the issue.</p>
            </div>
          `;
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
